alerts:
  - name: high_tail_latency
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-1
  - name: retrieval_success_degraded
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-2
  - name: request_error_rate_breach
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: on-call-llmops
    runbook: docs/alerts.md#alert-3
